<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .packet {
        animation: packetMove 6s linear infinite;
      }
      .pulse-circle {
        animation: pulseScale 3s ease-in-out infinite;
      }
      .pill-float {
        animation: floatPill 5s ease-in-out infinite alternate;
      }
      .pill-float-reverse {
        animation: floatPillRev 6s ease-in-out infinite alternate;
      }

      @keyframes packetMove {
        0% { stroke-dashoffset: 600; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      @keyframes pulseScale {
        0% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.8; }
        100% { transform: scale(1); opacity: 0.4; }
      }

      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      @keyframes floatPillRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <g opacity="0.3">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle cx="1000" cy="280" r="160" fill="#a855f7" filter="url(#glow-purple)" />
  </g>

  <!-- Background Technical Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Network Stream Flow Lines (Gateway routing abstraction in background) -->
  <g fill="none" stroke-linecap="round">
    <!-- Stream 1 -->
    <path d="M 50 180 C 250 80, 400 80, 600 180 C 800 280, 950 280, 1150 180" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" />
    <path d="M 50 180 C 250 80, 400 80, 600 180 C 800 280, 950 280, 1150 180" stroke="url(#accent-cyan)" stroke-width="3" stroke-dasharray="120 480" class="packet" />

    <!-- Stream 2 -->
    <path d="M 50 200 C 250 300, 400 300, 600 200 C 800 100, 950 100, 1150 200" stroke="#a855f7" stroke-opacity="0.15" stroke-width="2" />
    <path d="M 50 200 C 250 300, 400 300, 600 200 C 800 100, 950 100, 1150 200" stroke="url(#accent-purple)" stroke-width="3" stroke-dasharray="100 500" class="packet" style="animation-duration: 8s; animation-delay: -3s;" />
  </g>

  <!-- Decorative Architectural Nodes on Sides (Kept away from center text) -->
  <!-- Left Node (Client Layer) -->
  <g transform="translate(90, 180)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.6" />
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">APPS</text>
  </g>

  <!-- Right Nodes (LLM Providers) -->
  <g transform="translate(1110, 130)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600">LLMs</text>
  </g>
  <g transform="translate(1110, 230)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" fill="#fdf2f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600">SLMs</text>
  </g>

  <!-- Dynamic Capability Floating Badges/Pills (Positioned at Top & Bottom margins, never blocking text) -->
  <g class="pill-float" transform="translate(260, 46)">
    <rect width="140" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="76" y="18" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">⚡ Dynamic Routing</text>
  </g>

  <g class="pill-float-reverse" transform="translate(450, 46)">
    <rect width="140" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#a855f7" />
    <text x="76" y="18" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">🧠 Semantic Cache</text>
  </g>

  <g class="pill-float" transform="translate(640, 46)">
    <rect width="140" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#ec4899" />
    <text x="76" y="18" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">🛡️ AI Guardrails</text>
  </g>

  <g class="pill-float-reverse" transform="translate(830, 46)">
    <rect width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="72" y="18" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">💰 Cost Tracking</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Guaranteed High Contrast & Never Obscured) ================= -->
  <g id="hero-content">
    <!-- Top Category Tag -->
    <rect x="440" y="105" width="320" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="600" y="122" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
      PROXIES • ROUTERS • GATEWAYS • MCP
    </text>

    <!-- Main Title -->
    <text x="600" y="182" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome AI API Gateway &amp; Proxies
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Production-Ready LLM Routers, Unified Inference Proxies, Caching &amp; Guardrails
    </text>

    <!-- Bottom Feature Bullets / Protocol Badges -->
    <g transform="translate(340, 270)">
      <rect x="0" y="0" width="115" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="57" y="19" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">OpenAI API</text>

      <rect x="130" y="0" width="115" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="187" y="19" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Multi-Model</text>

      <rect x="260" y="0" width="125" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="322" y="19" text-anchor="middle" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Load Balancing</text>

      <rect x="400" y="0" width="120" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="460" y="19" text-anchor="middle" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Observability</text>
    </g>
  </g>
</svg>
